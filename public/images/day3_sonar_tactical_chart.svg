<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800" style="background:#07111e; font-family:'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;">
