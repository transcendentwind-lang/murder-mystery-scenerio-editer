<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" style="background-color: #fcfdfd; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="reef-pattern" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#ef4444" stroke-width="2.5" opacity="0.35" />
    </pattern>
    <radialGradient id="shallow-grad-ogasawara" cx="890" cy="110" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.5" />
