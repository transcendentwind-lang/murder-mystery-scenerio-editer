    <text x="125" y="112" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">【プレイヤー提示用：白地図】</text>
    <text x="125" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">CHART NO. W-2704</text>
