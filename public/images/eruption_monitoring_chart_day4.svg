    <circle cx="20" cy="94" r="4" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <text x="34" y="97" fill="#eab308" font-size="10">未噴火（今後の北上警戒海域）</text>
    <text x="12" y="118" fill="#64748b" font-size="8">※物体の時速約6km北上に伴い、マグマ溜まりが刺激され連動爆発</text>
